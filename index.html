<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Wijnkelder</title>
<style>
  :root {
    --grond: #F7F5F1; --vlak: #FFFFFF; --inkt: #2B2620; --inkt-zacht: #6E675D;
    --lijn: #E4E0D8; --accent: #7A1E2E; --accent-inkt: #FFFFFF;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --grond: #171412; --vlak: #211D1A; --inkt: #EDE8E0; --inkt-zacht: #A79E92;
      --lijn: #383129; --accent: #D08090; --accent-inkt: #26161A;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--grond); color: var(--inkt);
    font-family: -apple-system, "Segoe UI", sans-serif; padding: 20px;
  }
  .kaart {
    background: var(--vlak); border: 1px solid var(--lijn); border-radius: 16px;
    padding: 28px 24px; max-width: 340px; width: 100%; text-align: center;
    box-shadow: 0 4px 20px rgba(0,0,0,.07);
  }
  .glas { font-size: 38px; }
  h1 { font-size: 20px; margin: 8px 0 4px; font-weight: 650; }
  p { color: var(--inkt-zacht); font-size: 14px; margin: 0 0 18px; line-height: 1.5; }
  input[type="password"] {
    width: 100%; font-size: 17px; padding: 11px 13px; border-radius: 10px;
    border: 1px solid var(--lijn); background: var(--grond); color: var(--inkt);
    text-align: center; outline: none;
  }
  input[type="password"]:focus { border-color: var(--accent); }
  button {
    width: 100%; margin-top: 12px; padding: 12px; font-size: 16px; font-weight: 600;
    background: var(--accent); color: var(--accent-inkt); border: 0; border-radius: 10px;
    cursor: pointer;
  }
  label.onthoud {
    display: flex; gap: 7px; align-items: center; justify-content: center;
    margin-top: 14px; font-size: 13px; color: var(--inkt-zacht); cursor: pointer;
  }
  .fout { color: #C0392B; font-size: 13px; min-height: 18px; margin-top: 10px; }
  .laden { color: var(--inkt-zacht); font-size: 13px; margin-top: 10px; display: none; }
</style>
</head>
<body>
<form class="kaart" id="form">
  <div class="glas">🍷</div>
  <h1>Wijnkelder</h1>
  <p>Deze pagina is beveiligd.<br>Voer het wachtwoord in dat je hebt gekregen.</p>
  <input type="password" id="ww" autocomplete="current-password" autofocus
         placeholder="wachtwoord" aria-label="Wachtwoord">
  <button type="submit">Open de kelder</button>
  <label class="onthoud"><input type="checkbox" id="onthoud" checked> onthoud op dit apparaat</label>
  <div class="fout" id="fout"></div>
  <div class="laden" id="laden">Ontgrendelen…</div>
</form>

<script>
(function () {
  "use strict";
  var ITER = 300000;

  function b64bytes(s) {
    var bin = atob(s.trim());
    var uit = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) uit[i] = bin.charCodeAt(i);
    return uit;
  }

  async function ontsleutel(ww) {
    var alles = b64bytes(document.getElementById("kluis").textContent);
    var salt = alles.slice(0, 16), nonce = alles.slice(16, 28), cijfer = alles.slice(28);
    var basis = await crypto.subtle.importKey("raw", new TextEncoder().encode(ww),
      "PBKDF2", false, ["deriveKey"]);
    var sleutel = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: salt, iterations: ITER, hash: "SHA-256" },
      basis, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    var klaar = await crypto.subtle.decrypt({ name: "AES-GCM", iv: nonce }, sleutel, cijfer);
    return new TextDecoder().decode(klaar);
  }

  async function probeer(ww, stil) {
    if (!ww) return;
    document.getElementById("laden").style.display = "block";
    document.getElementById("fout").textContent = "";
    try {
      var html = await ontsleutel(ww);
      try {
        if (document.getElementById("onthoud").checked) localStorage.setItem("kelder-ww", ww);
        else localStorage.removeItem("kelder-ww");
      } catch (e) { /* opslag niet beschikbaar */ }
      document.open();
      document.write(html);
      document.close();
    } catch (e) {
      document.getElementById("laden").style.display = "none";
      if (!stil) document.getElementById("fout").textContent = "Dat wachtwoord klopt niet — probeer het nog eens.";
      try { localStorage.removeItem("kelder-ww"); } catch (e2) { /* — */ }
    }
  }

  document.getElementById("form").addEventListener("submit", function (e) {
    e.preventDefault();
    probeer(document.getElementById("ww").value, false);
  });

  try {
    var bewaard = localStorage.getItem("kelder-ww");
    if (bewaard) probeer(bewaard, true);
  } catch (e) { /* opslag niet beschikbaar */ }
})();
</script>
